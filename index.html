<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovdizzle</title>
</head>
</head>
<body style="margin:0; padding:0; min-height:100vh; width:100vw; background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Segoe UI', Arial, sans-serif;">
    <div style="background: rgba(255,255,255,0.15); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); backdrop-filter: blur(6px); border-radius: 24px; padding: 48px 36px 36px 36px; text-align: center; border: 1px solid rgba(255,255,255,0.18);">
        <h1 style="color:#fff; font-size:48px; margin-bottom: 12px; letter-spacing: 2px; text-shadow: 2px 2px 8px #ff5e62;">Welcome to <span style="color:#ffe066;">Ovdizzle</span></h1>
        <p style="color:#f8f9fa; font-size:22px; margin-bottom: 24px;">Your colourful Rust HTTP file server is running!<br>Browse your files and enjoy the view.</p>
        <div style="display: flex; justify-content: center; gap: 18px; margin-top: 18px;">
            <a href="/" style="background: #ffe066; color: #ff5e62; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: bold; box-shadow: 0 2px 8px rgba(255,224,102,0.2); transition: background 0.2s, color 0.2s;">Home</a>
            <a href="https://www.rust-lang.org/" target="_blank" style="background: #fff; color: #ff5e62; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: bold; box-shadow: 0 2px 8px rgba(255,255,255,0.2); transition: background 0.2s, color 0.2s;">Learn Rust</a>
        </div>
    </div>
    <footer style="margin-top: 40px; color: #fff; font-size: 16px; opacity: 0.8;">&copy; 2025 Ovdizzle Server</footer>
</body>
</html>
